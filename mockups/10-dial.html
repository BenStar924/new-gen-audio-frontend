<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>10 — Dial centric</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:800px;height:480px;overflow:hidden;background:#0c1017;color:#e6edf5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.seg{display:flex;background:#161d27;border:1px solid #242e3a;border-radius:99px;padding:4px;gap:3px}
.sg{width:62px;height:44px;border-radius:99px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:17px;font-weight:800;color:#94a3b3}
.sg.on{background:#2f81f7;color:#fff}
.sg i{width:5px;height:5px;border-radius:50%;background:#2c3542;display:block}
.sg i.g{background:#2ea043}
.sg.on i{background:rgba(255,255,255,.4)}.sg.on i.g{background:#a7f3c8}
.rt{display:flex;align-items:center;gap:10px}
.chip{padding:7px 14px;border-radius:99px;background:#161d27;border:1px solid #242e3a;
  font-size:11px;font-weight:800;letter-spacing:.12em;color:#2ea043}
.gear{width:46px;height:46px;border-radius:14px;background:#161d27;border:1px solid #242e3a;
  display:flex;align-items:center;justify-content:center;font-size:20px}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:34px;padding:0 22px 14px}
.dial{position:relative;width:270px;height:270px}
.dial .rd{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.rd b{font-size:62px;font-weight:800;line-height:1}
.rd span{font-size:11px;letter-spacing:.2em;color:#94a3b3;font-weight:800}
.rd em{font-size:12px;font-style:normal;color:#7db3ff;font-weight:700;letter-spacing:.1em;margin-top:5px}
.side{display:flex;flex-direction:column;gap:12px;width:210px}
.b{height:84px;border-radius:16px;border:1px solid #242e3a;background:#161d27;
  display:flex;align-items:center;gap:13px;padding:0 17px}
.b .ic{font-size:27px}
.b .tx{display:flex;flex-direction:column}
.b .lb{font-size:11px;color:#94a3b3}
.b .st{font-size:19px;font-weight:800;letter-spacing:.05em}
.b.live{background:#2ea043;border-color:#2ea043;color:#06210d}.b.live .lb{color:#0b3d18}
.steps{display:flex;gap:12px}
.k{flex:1;height:64px;border-radius:16px;border:1px solid #242e3a;background:#161d27;
  font-size:28px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<header>
  <div class="seg">
    <div class="sg">1<i></i></div>
    <div class="sg on">2<i class="g"></i></div>
    <div class="sg">3<i></i></div>
    <div class="sg">4<i class="g"></i></div>
  </div>
  <div class="rt"><div class="chip">READY</div><div class="gear">⚙</div></div>
</header>
<main>
  <div class="dial">
    <svg width="270" height="270" viewBox="0 0 270 270">
      <circle cx="135" cy="135" r="112" fill="none" stroke="#161d27" stroke-width="26"/>
      <!-- level ring (outer, thin) -->
      <circle cx="135" cy="135" r="131" fill="none" stroke="#141a23" stroke-width="7"/>
      <circle cx="135" cy="135" r="131" fill="none" stroke="#2ea043" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="510 823" stroke-dashoffset="0"
              transform="rotate(135 135 135)"/>
      <!-- volume arc 65% of a 270deg sweep -->
      <circle cx="135" cy="135" r="112" fill="none" stroke="#2f81f7" stroke-width="26"
              stroke-linecap="round" stroke-dasharray="343 704" transform="rotate(135 135 135)"/>
    </svg>
    <div class="rd"><b>65</b><span>VOLUME</span><em>LANE 2</em></div>
  </div>
  <div class="side">
    <div class="b live"><span class="ic">🎙</span><span class="tx"><span class="lb">Mic</span><span class="st">LIVE</span></span></div>
    <div class="b"><span class="ic">🔊</span><span class="tx"><span class="lb">Speakers</span><span class="st">ON</span></span></div>
    <div class="steps"><div class="k">−</div><div class="k">+</div></div>
  </div>
</main>
</body></html>
