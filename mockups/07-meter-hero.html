<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>07 — Meter hero</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:800px;height:480px;overflow:hidden;background:#0a0d11;color:#e6edf5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;
  background:#121820;border-bottom:1px solid #212b36}
h1{font-size:16px;font-weight:600}
.sub{font-size:10px;letter-spacing:.14em;color:#94a3b3;font-weight:800}
main{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0}
.row{flex:1;display:flex;align-items:center;gap:10px;background:#121820;border:1px solid #212b36;
  border-radius:12px;padding:8px 11px}
.row.on{border-color:#2f81f7;background:#111a29}
.id{width:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.id b{font-size:26px;font-weight:800;line-height:1}
.row.on .id b{color:#7db3ff}
.id small{font-size:8px;letter-spacing:.14em;color:#94a3b3;font-weight:800}
.mt{flex:1;display:flex;gap:2px;height:100%;align-items:stretch}
.s{flex:1;border-radius:2px;background:#1a222d}
.s.g{background:#2ea043}.s.a{background:#d29922}.s.r{background:#da3633}
.tags{display:flex;gap:5px;width:104px;justify-content:flex-end}
.t{font-size:9px;font-weight:800;letter-spacing:.08em;padding:4px 7px;border-radius:5px;
  background:#1a222d;color:#5d6b7a}
.t.mic{background:#2ea043;color:#06210d}
.t.spk{background:#d29922;color:#241a00}
.v{width:44px;text-align:right;font-size:19px;font-weight:800}
.bar{height:82px;display:flex;gap:9px;padding:0 10px 10px}
.ctl{flex:1;border-radius:11px;border:1px solid #212b36;background:#121820;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;color:#94a3b3}
.ctl b{font-size:15px;font-weight:800;letter-spacing:.06em;color:#e6edf5}
.ctl.live{background:#2ea043;border-color:#2ea043;color:#0b3d18}.ctl.live b{color:#06210d}
.ctl.step{flex:0 0 74px;font-size:30px;color:#e6edf5}
.ctl.vol{flex:0 0 104px}
.ctl.vol b{font-size:30px}
</style></head><body>
<header><h1>Operator Console</h1><span class="sub">LANE 2 SELECTED · READY · ⚙</span></header>
<main>
  <div class="row">
    <div class="id"><b>1</b><small>LANE</small></div>
    <div class="mt"><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
    <div class="tags"><span class="t">MIC</span><span class="t">SPKR</span></div><div class="v">60</div>
  </div>
  <div class="row on">
    <div class="id"><b>2</b><small>LANE</small></div>
    <div class="mt"><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s a"></i><i class="s a"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
    <div class="tags"><span class="t mic">MIC</span><span class="t spk">SPKR</span></div><div class="v">65</div>
  </div>
  <div class="row">
    <div class="id"><b>3</b><small>LANE</small></div>
    <div class="mt"><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
    <div class="tags"><span class="t">MIC</span><span class="t">SPKR</span></div><div class="v">45</div>
  </div>
  <div class="row">
    <div class="id"><b>4</b><small>LANE</small></div>
    <div class="mt"><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
    <div class="tags"><span class="t mic">MIC</span><span class="t">SPKR</span></div><div class="v">72</div>
  </div>
</main>
<div class="bar">
  <div class="ctl live">Mic<b>LIVE</b></div>
  <div class="ctl">Speakers<b>ON</b></div>
  <div class="ctl step">−</div>
  <div class="ctl vol">VOL<b>65</b></div>
  <div class="ctl step">+</div>
</div>
</body></html>
