<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>08 — Minimal typographic</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:800px;height:480px;overflow:hidden;background:#000;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
  padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.lanes{display:flex;gap:26px}
.l{font-size:19px;font-weight:600;color:#3d3d3d;position:relative;padding-bottom:9px}
.l.on{color:#fff}
.l.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff}
.l .pip{position:absolute;top:-6px;right:-9px;width:7px;height:7px;border-radius:50%;background:#22c55e}
.st{font-size:11px;letter-spacing:.2em;color:#5c5c5c;font-weight:700}
.mid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:30px}
.big{font-size:132px;font-weight:200;line-height:.85;letter-spacing:-.04em}
.big span{font-size:24px;font-weight:600;letter-spacing:.2em;color:#5c5c5c;display:block;margin-top:10px}
.rt{display:flex;flex-direction:column;gap:13px;align-items:flex-end}
.sw{display:flex;align-items:center;gap:14px}
.sw .k{font-size:13px;letter-spacing:.18em;color:#5c5c5c;font-weight:700}
.sw .v{font-size:25px;font-weight:600;min-width:96px;text-align:right}
.sw.on .v{color:#22c55e}
.sw.amber .v{color:#f59e0b}
.bot{display:flex;align-items:center;gap:16px}
.mtr{flex:1;display:flex;gap:3px;height:5px}
.s{flex:1;background:#232323;border-radius:99px}
.s.on{background:#fff}
.pm{display:flex;gap:11px}
.k{width:56px;height:56px;border-radius:50%;border:1px solid #2b2b2b;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#c9c9c9}
</style></head><body>
<div class="top">
  <div class="lanes">
    <div class="l">1</div>
    <div class="l on">2</div>
    <div class="l">3</div>
    <div class="l">4<span class="pip"></span></div>
  </div>
  <div class="st">READY</div>
</div>
<div class="mid">
  <div class="big">65<span>VOLUME</span></div>
  <div class="rt">
    <div class="sw on"><span class="k">MIC</span><span class="v">LIVE</span></div>
    <div class="sw amber"><span class="k">SPEAKERS</span><span class="v">ON</span></div>
    <div class="sw"><span class="k">LANE</span><span class="v">2</span></div>
  </div>
</div>
<div class="bot">
  <div class="mtr">
    <i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i>
    <i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i>
    <i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i><i class="s on"></i>
    <i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i>
    <i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i>
  </div>
  <div class="pm"><div class="k">−</div><div class="k">+</div><div class="k">⚙</div></div>
</div>
</body></html>
