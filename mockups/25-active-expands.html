<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>25 — Active lane expands</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:800px;height:480px;overflow:hidden;background:#0b0e13;color:#e6edf5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  background:#141920;border-bottom:1px solid #242e3a}
h1{font-size:16px;font-weight:600}
.sub{font-size:10px;letter-spacing:.14em;color:#94a3b3;font-weight:800}
main{flex:1;display:flex;gap:9px;padding:9px;min-height:0}
/* The selected lane takes the space; the rest shrink to a strip. This is the
   layout idea: the lane you are controlling is physically bigger. */
.rest{width:132px;display:flex;flex-direction:column;gap:9px}
.sm{flex:1;border-radius:12px;background:#141920;border:2px solid #232c39;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sm b{font-size:28px;font-weight:800;line-height:1}
.sm small{font-size:9px;letter-spacing:.14em;color:#94a3b3;font-weight:800}
.pips{display:flex;gap:5px;margin-top:3px}
.p{width:7px;height:7px;border-radius:50%;background:#232c39}
.p.g{background:#2ea043}.p.a{background:#d29922}
.big{flex:1;border-radius:16px;background:#16243c;border:2px solid #2f81f7;padding:13px;
  display:flex;flex-direction:column;gap:11px;min-width:0}
.bh{display:flex;align-items:center;justify-content:space-between}
.bh .n{display:flex;align-items:baseline;gap:11px}
.bh .n b{font-size:52px;font-weight:800;line-height:1;color:#8ec0ff}
.bh .n span{font-size:12px;letter-spacing:.16em;color:#94a3b3;font-weight:800}
.bh .tags{display:flex;gap:6px}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;padding:6px 11px;border-radius:99px}
.tag.mic{background:#2ea043;color:#06210d}
.tag.spk{background:#d29922;color:#241a00}
.mt{height:15px;display:flex;gap:3px}
.s{flex:1;border-radius:2px;background:#1d2634}
.s.g{background:#2ea043}.s.a{background:#d29922}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{height:76px;border-radius:12px;border:1px solid #2c3542;background:#1b2330;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;color:#94a3b3}
.b .st{font-size:16px;font-weight:800;letter-spacing:.05em;color:#e6edf5}
.b.live{background:#2ea043;border-color:#2ea043;color:#0b3d18}.b.live .st{color:#06210d}
.b.amber{background:#d29922;border-color:#d29922;color:#4a3600}.b.amber .st{color:#241a00}
.vol{display:flex;align-items:center;gap:10px}
.step{width:74px;height:66px;border-radius:12px;border:1px solid #2c3542;background:#1b2330;
  font-size:30px;display:flex;align-items:center;justify-content:center}
.vb{flex:1;height:66px;border-radius:12px;background:#0b0e13;border:1px solid #2c3542;
  display:flex;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden}
.vf{position:absolute;left:0;top:0;bottom:0;width:65%;background:#2f81f7;opacity:.3}
.vb b{font-size:32px;font-weight:800;position:relative;line-height:1}
.vb span{font-size:10px;letter-spacing:.16em;color:#94a3b3;font-weight:800;position:relative}
</style></head><body>
<header><h1>Operator Console</h1><span class="sub">READY · ⚙</span></header>
<main>
  <div class="rest">
    <div class="sm"><b>1</b><small>LANE</small><div class="pips"><i class="p"></i><i class="p"></i></div></div>
    <div class="sm"><b>3</b><small>LANE</small><div class="pips"><i class="p"></i><i class="p"></i></div></div>
    <div class="sm"><b>4</b><small>LANE</small><div class="pips"><i class="p g"></i><i class="p"></i></div></div>
  </div>
  <div class="big">
    <div class="bh">
      <div class="n"><b>2</b><span>LANE</span></div>
      <div class="tags"><span class="tag mic">MIC LIVE</span><span class="tag spk">SPKR ON</span></div>
    </div>
    <div class="mt">
      <i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i>
      <i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s g"></i>
      <i class="s g"></i><i class="s g"></i><i class="s g"></i><i class="s a"></i><i class="s a"></i>
      <i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i>
      <i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i>
    </div>
    <div class="pair">
      <div class="b live">Mic<span class="st">LIVE</span></div>
      <div class="b amber">Speakers<span class="st">ON</span></div>
    </div>
    <div class="vol">
      <div class="step">−</div>
      <div class="vb"><div class="vf"></div><b>65</b><span>VOL</span></div>
      <div class="step">+</div>
    </div>
  </div>
</main>
</body></html>
