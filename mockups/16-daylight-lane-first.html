<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>16 — Daylight lane-first (02×05)</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:800px;height:480px;overflow:hidden;background:#dfe4ea;color:#0f172a;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px}
.lane{border-radius:16px;background:#fff;border:2px solid #cbd5e1;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lane.on{background:#1d4ed8;border-color:#1e3a8a;color:#fff;box-shadow:0 5px 0 #1e3a8a}
.n{font-size:66px;font-weight:800;line-height:.9}
.nm{font-size:12px;letter-spacing:.16em;color:#64748b;font-weight:800}
.lane.on .nm{color:#c7dbff}
.tags{position:absolute;top:11px;left:12px;display:flex;gap:6px}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;padding:5px 10px;border-radius:99px;
  background:#e2e8f0;color:#64748b}
.tag.mic{background:#16a34a;color:#fff}
.tag.spk{background:#ea580c;color:#fff}
.lvl{position:absolute;right:12px;top:12px;bottom:12px;width:9px;border-radius:99px;
  background:#e2e8f0;overflow:hidden}
.lane.on .lvl{background:#1e3a8a}
.lvl i{position:absolute;bottom:0;left:0;right:0;border-radius:99px;
  background:linear-gradient(#ea580c,#16a34a)}
.bar{height:98px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;
  border-top:2px solid #cbd5e1}
.ctx{font-size:11px;font-weight:800;letter-spacing:.12em;color:#1d4ed8;writing-mode:vertical-rl;
  transform:rotate(180deg);text-align:center}
.b{flex:1;height:100%;border-radius:14px;border:2px solid #cbd5e1;background:#f8fafc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;color:#64748b}
.b .s{font-size:16px;font-weight:800;letter-spacing:.05em;color:#0f172a}
.b.live{background:#16a34a;border-color:#14532d;color:#dcfce7;box-shadow:0 4px 0 #14532d}
.b.live .s{color:#fff}
.step{width:80px;height:100%;border-radius:14px;border:2px solid #cbd5e1;background:#f8fafc;
  font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #cbd5e1}
.vol{width:112px;text-align:center}
.vol b{font-size:38px;font-weight:800;line-height:1}
.vol span{display:block;font-size:10px;letter-spacing:.14em;color:#64748b;font-weight:800}
</style></head><body>
<div class="grid">
  <div class="lane"><div class="tags"><span class="tag">OFF</span></div><div class="n">1</div><div class="nm">LANE 1</div>
    <div class="lvl"><i style="height:0"></i></div></div>
  <div class="lane on"><div class="tags"><span class="tag mic">MIC</span><span class="tag spk">65</span></div>
    <div class="n">2</div><div class="nm">LANE 2</div><div class="lvl"><i style="height:62%"></i></div></div>
  <div class="lane"><div class="tags"><span class="tag">OFF</span></div><div class="n">3</div><div class="nm">LANE 3</div>
    <div class="lvl"><i style="height:0"></i></div></div>
  <div class="lane"><div class="tags"><span class="tag mic">MIC</span></div><div class="n">4</div><div class="nm">LANE 4</div>
    <div class="lvl"><i style="height:0"></i></div></div>
</div>
<div class="bar">
  <div class="ctx">LANE 2</div>
  <div class="b live">Mic<span class="s">LIVE</span></div>
  <div class="b">Speakers<span class="s">ON</span></div>
  <div class="step">−</div>
  <div class="vol"><b>65</b><span>VOL</span></div>
  <div class="step">+</div>
  <div class="step">⚙</div>
</div>
</body></html>
