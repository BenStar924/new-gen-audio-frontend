name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          python3 -m py_compile dev-server.py contract-test.py
          node --check www/app.js
      - name: Contract test against the reference backend
        run: |
          python3 dev-server.py 8000 &
          sleep 1
          python3 contract-test.py --bench --dev-password 9999
      - name: Release package builds
        run: ./make-release.sh
