<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Console</title>
  <!-- Inline favicon: the device is offline, and without this every load spends
       a request on a /favicon.ico that isn't there. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='%232f81f7'/></svg>">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.7 3.7v8L12 19.7 5.3 16V8L12 4.3Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <h1>Operator Console</h1>
    </div>

    <div class="topbar-right">
      <div id="status-pill" class="status-pill status-offline">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">CONNECTING</span>
      </div>
      <button id="btn-settings" class="btn btn-icon" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.4 13a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2.1-1.6a.5.5 0 0 0 .1-.7l-2-3.4a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.5l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.7L4.5 11a7.8 7.8 0 0 0-.1 1 7.8 7.8 0 0 0 .1 1l-2.1 1.6a.5.5 0 0 0-.1.7l2 3.4c.1.2.4.3.6.2l2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.5l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.7L19.4 13ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="panel-grid">

    <section class="card lanes-card" aria-labelledby="lanes-heading">
      <h2 id="lanes-heading" class="card-title">Lane</h2>
      <div id="lane-grid" class="lane-grid">
        <!-- lane buttons generated by app.js -->
      </div>
    </section>

    <section class="card controls-card" aria-labelledby="controls-heading">
      <h2 id="controls-heading" class="card-title">Audio</h2>

      <div class="latch-row">
        <button id="btn-mic" class="btn btn-latch" aria-pressed="false">
          <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
            <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2Z"/>
          </svg>
          <span class="latch-label">Mic</span>
          <span class="latch-state" data-on="LIVE" data-off="OFF">OFF</span>
        </button>

        <button id="btn-mute" class="btn btn-latch" aria-pressed="true">
          <!-- Both icons ship; CSS shows the one matching aria-pressed, so the
               glyph never contradicts the state label beneath it. -->
          <svg class="icon icon-lg icon-muted" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4Z"/>
            <path d="m21.2 12 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1Z"/>
          </svg>
          <svg class="icon icon-lg icon-unmuted" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4Z"/>
            <path d="M16 7.5a5 5 0 0 1 0 9v-2a3 3 0 0 0 0-5v-2Z"/>
            <path d="M16 3a9 9 0 0 1 0 18v-2a7 7 0 0 0 0-14V3Z"/>
          </svg>
          <span class="latch-label">Speakers</span>
          <span class="latch-state" data-on="MUTED" data-off="ON">MUTED</span>
        </button>
      </div>

      <div class="volume-block">
        <div class="volume-row">
          <button id="btn-vol-down" class="btn btn-step" aria-label="Volume down">&minus;</button>
          <div class="volume-readout">
            <span id="volume-value">60</span>
            <span class="volume-unit">VOL</span>
          </div>
          <button id="btn-vol-up" class="btn btn-step" aria-label="Volume up">+</button>
        </div>
        <div id="level-meter" class="level-meter" role="img" aria-label="Audio level meter">
          <!-- segments generated by app.js -->
        </div>
      </div>
    </section>

  </main>

  <footer class="statusbar">
    <span id="footer-msg">Starting&hellip;</span>
    <span id="footer-version" class="footer-version"></span>
  </footer>

  <div id="settings-overlay" class="overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
      <h2 id="settings-heading" class="card-title">Settings</h2>

      <div class="settings-row">
        <span class="settings-label">Display brightness</span>
        <div class="stepper">
          <button id="btn-bright-down" class="btn btn-step" aria-label="Brightness down">&minus;</button>
          <span id="brightness-value" class="stepper-value">80</span>
          <button id="btn-bright-up" class="btn btn-step" aria-label="Brightness up">+</button>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-label">Backend</span>
        <span id="settings-backend" class="settings-value">&mdash;</span>
      </div>

      <div class="settings-row">
        <span class="settings-label">UI version</span>
        <span id="settings-version" class="settings-value">&mdash;</span>
      </div>

      <div class="modal-actions">
        <button id="btn-reload" class="btn btn-secondary">Reload UI</button>
        <button id="btn-settings-close" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>

  <script defer src="app.js"></script>
</body>
</html>
